<script>
  // Photo lightbox（所有剧照可点击放大 + 左右切换）
  (function(){
    const imgs = Array.from(document.querySelectorAll('.gallery-mosaic img, .filmstrip__item img, .gallery-grid img'));
    if (!imgs.length) return;
    const lb = document.getElementById('photoLb');
    const lbImg = document.getElementById('photoLbImg');
    const lbCap = document.getElementById('photoLbCap');
    let idx = 0;
    function show(i){
      idx = (i + imgs.length) % imgs.length;
      const src = imgs[idx].currentSrc || imgs[idx].src;
      lbImg.style.opacity = '0';
      const pre = new Image();
      pre.onload = ()=>{ lbImg.src = src; lbImg.style.opacity = '1'; };
      pre.src = src;
      lbCap.innerHTML = `FRAME ${String(idx+1).padStart(2,'0')} <span style="margin-left:14px;opacity:.55">${idx+1} / ${imgs.length}</span>`;
    }
    function open(i){ show(i); lb.classList.add('is-open'); document.body.style.overflow = 'hidden'; }
    function close(){ lb.classList.remove('is-open'); document.body.style.overflow = ''; }
    imgs.forEach((img, i)=> img.addEventListener('click', ()=> open(i)));
    document.getElementById('photoLbClose').addEventListener('click', close);
    document.getElementById('photoLbPrev').addEventListener('click', ()=> show(idx-1));
    document.getElementById('photoLbNext').addEventListener('click', ()=> show(idx+1));
    lb.addEventListener('click', (e)=>{ if (e.target === lb) close(); });
    document.addEventListener('keydown', (e)=>{
      if (!lb.classList.contains('is-open')) return;
      if (e.key === 'Escape') close();
      if (e.key === 'ArrowLeft')  show(idx-1);
      if (e.key === 'ArrowRight') show(idx+1);
    });
  })();

  // 视频双源切换
  (function(){
    const modal = document.getElementById('videoModal');
    const iframe = modal?.querySelector('iframe');
    const closeBtn = modal?.querySelector('.video-modal__close');
    const SRC = {
      youtube:  'https://www.youtube.com/embed/GGDgrTKY2Qs?autoplay=1&rel=0',
      bilibili: '//player.bilibili.com/player.html?bvid=BV12zAuztE78&page=1&high_quality=1&danmaku=0&autoplay=1'
    };
    function open(key){
      iframe.src = SRC[key] || SRC.youtube;
      modal.classList.add('is-open');
      document.body.style.overflow = 'hidden';
    }
    function close(){
      iframe.src = '';
      modal.classList.remove('is-open');
      document.body.style.overflow = '';
    }
    document.querySelectorAll('[data-video]').forEach(btn=>{
      btn.addEventListener('click', (e)=>{ e.stopPropagation(); open(btn.dataset.video); });
    });
    closeBtn?.addEventListener('click', close);
    modal?.addEventListener('click', (e)=>{ if (e.target === modal) close(); });
    document.addEventListener('keydown', (e)=>{ if (e.key === 'Escape') close(); });
  })();
</script>

<script>
/* 汉堡菜单（移动端） */
(function hamburger(){
  const navEl = document.getElementById('nav') || document.querySelector('.nav');
  const burger = document.getElementById('navBurger');
  if (!burger || !navEl) return;
  const body = document.body;
  const closeNav = () => {
    navEl.classList.remove('nav--open');
    burger.setAttribute('aria-expanded', 'false');
    body.style.overflow = '';
  };
  burger.addEventListener('click', (e) => {
    e.stopPropagation();
    const open = navEl.classList.toggle('nav--open');
    burger.setAttribute('aria-expanded', open ? 'true' : 'false');
    body.style.overflow = open ? 'hidden' : '';
  });
  navEl.querySelectorAll('.nav__link').forEach(a => a.addEventListener('click', closeNav));
  document.addEventListener('click', (e) => {
    if (navEl.classList.contains('nav--open') && !navEl.contains(e.target)) closeNav();
  });
})();
</script>

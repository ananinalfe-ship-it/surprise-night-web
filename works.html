<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>作品 — 惊喜之夜</title>
    <meta
      name="description"
      content="惊喜之夜作品列表：沉浸式戏剧、体验式演出、新中式戏曲。"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Sans+SC:wght@300;400;500;600&family=Noto+Serif+SC:wght@400;500;600&family=Syne:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="page-works" data-i18n-page="works">
    <header class="site-header">
      <div class="inner">
        <a href="index.html" class="logo" style="display: flex; align-items: center; gap: 12px; font-size: 1.1rem;">
          <img src="assets/images/logo.png" alt="" style="width: 32px; height: 32px; object-fit: contain;">
          <span>惊喜之夜 <span style="opacity: 0.7; font-size: 0.75rem; font-weight: 400; margin-left: 4px;">/ Surprise Night</span></span>
        </a>
        <button type="button" class="nav-toggle" data-i18n="nav.menu" aria-expanded="false" aria-controls="primary-nav">
          菜单
        </button>
        <nav>
          <ul id="primary-nav" class="nav-links">
            <li><a href="works.html" aria-current="page" data-i18n="nav.works">作品</a></li>
            <li><a href="collaborate.html" data-i18n="nav.collaborate">合作</a></li>
            <li class="nav-item nav-item--has-sub">
            <a href="about.html" data-i18n="nav.about">关于</a>
            <ul class="nav-sub" role="list">
              <li><a href="collaborators.html" data-i18n="nav.collaborators">合作艺术家</a></li>
            </ul>
          </li>
            <li><a href="contact.html" data-i18n="nav.contact">联系</a></li>
            <li class="nav-lang" aria-label="Language">
              <button type="button" class="lang-btn" data-set-lang="zh" aria-pressed="true">中</button>
              <button type="button" class="lang-btn" data-set-lang="en" aria-pressed="false">EN</button>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <section class="works-hero" aria-labelledby="works-hero-title">
        <div class="works-hero__media" aria-hidden="true"></div>
        <div class="works-hero__veil" aria-hidden="true"></div>
        <div class="works-hero__grain" aria-hidden="true"></div>
        <div class="container works-hero__inner">
          <p class="works-hero__eyebrow" data-i18n="worksPage.heroEyebrow">剧目与项目</p>
          <h1 id="works-hero-title" class="works-hero__title" data-i18n="worksPage.h1">作品</h1>
          <p class="works-hero__lead" data-i18n="worksPage.lead">
            按体验类型浏览。旗舰制作与沉浸、体验式与新中式戏曲并列呈现——点开卡片进入完整介绍。
          </p>
        </div>
      </section>

      <section class="section works-catalog">
        <div class="container">
          <div class="filter-bar filter-bar--works" data-works-filter-bar>
            <button type="button" class="is-active" data-filter="all" data-i18n="worksPage.fAll">全部</button>
            <button type="button" data-filter="immersive" data-i18n="worksPage.fImmersive">沉浸式戏剧</button>
            <button type="button" data-filter="experiential" data-i18n="worksPage.fExp">体验式演出</button>
            <button type="button" data-filter="neo-chinese" data-i18n="worksPage.fNeo">新中式戏曲</button>
          </div>
          <div
            class="grid-works works-catalog__grid"
            data-works-grid="all"
            data-works-spotlight="true"
          ></div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="inner">
        <span data-i18n="worksPage.footerCopy">© 2026 惊喜之夜</span>
        <a href="collaborate.html" data-i18n="worksPage.footerLink">合作咨询</a>
      </div>
    </footer>

    <script src="js/i18n.js" defer></script>
    <script src="js/main.js" defer></script>
    <script src="js/works-render.js" defer></script>
    <script src="js/works-filter.js" defer></script>
  </body>
</html>

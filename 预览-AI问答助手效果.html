<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>预览 — 对话小框效果</title>
<style>
  body {
    margin: 0; padding: 40px;
    font-family: -apple-system, 'PingFang SC', sans-serif;
    background: #111; color: #ccc; min-height: 100vh;
  }
  .notice {
    max-width: 600px; margin: 60px auto; text-align: center; line-height: 2;
  }
  .notice h2 { color: #D4763C; font-size: 20px; margin-bottom: 16px; }
  .notice p { font-size: 14px; color: #999; }
  .arrow { font-size: 40px; margin-top: 30px; animation: bounce 1.5s infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(10px)} }
</style>
</head>
<body>

<div class="notice">
  <h2>这是你官网的背景（实际会是你官网原样）</h2>
  <p>我没有改你网站的任何设计，只是在右下角加了一个对话小气泡。</p>
  <p>👇 <b>请看右下角的橙色圆按钮</b>，点它试试 👇</p>
  <div class="arrow">↘</div>
</div>

<!-- 模拟 AI 流式回复（本地预览用） -->
<script>
var _origFetch = window.fetch;
window.fetch = function(url, opts) {
  if (typeof url === 'string' && url.indexOf('/api/chat') !== -1) {
    var body = JSON.parse(opts.body || '{}');
    var q = (body.message || '').trim();

    var answers = {
      '这个剧讲什么？': '《山海经·巨灵之梦》讲的是2080年13岁少年连夜和AI伙伴素夷被召唤进入山海经世界，面对毕方、九尾狐、应龙等神兽，最终打败共工拯救两个世界的冒险故事。这是中国首部沉浸式木偶戏剧，由惊喜之夜和扬州木偶研究所联合出品，2026年2月首演。',
      '演出合作模式': '我们有四种合作方式：巡演合作（我们有全球独家运营权）、联合出品、IP授权、衍生品合作。场地建议300-800座中小型剧场。具体方案我们可以详聊，方便留个微信或电话吗？',
      '票价和时长': '演出约90分钟（30分钟互动+45分钟主剧目+15分钟后场狂欢）。基础票138元、VIP票288元、家庭套票688元。适合5岁以上儿童和家庭，成人也能享受。',
      '有什么独特亮点？': '三大亮点：一是三类木偶体系——小偶加6个带LED灯光的巨型机械偶加神兽偶群；二是沉浸式舞美——充气雕塑舞台配多媒体投影；三是文化融合——山海经古典神话和2080年AI世界的碰撞，国内首创。',
      '导演和团队': '导演袁冶是惊喜之夜创始人，操盘过8+部原创剧目。编剧瞿菡，剧本6轮打磨。音乐设计Sid Peacock（外籍），偶设计孙老师，舞美吴德彪。还与扬州木偶研究所深度合作。',
      '衍生品合作': '目前规划角色玩偶、山海经神兽文创、DIY体验包等。还在开发AI互动玩具原型。如果您有衍生品方面的合作兴趣，方便留个联系方式，我让业务团队跟您详细聊聊？'
    };

    var reply = answers[q] || '你好！我是惊喜之夜的咨询顾问小惊。关于《山海经·巨灵之梦》或演出合作，有什么想了解的尽管问我～';

    var encoder = new TextEncoder();
    var chunks = [];
    for (var i = 0; i < reply.length; i += 2) {
      chunks.push('data: ' + JSON.stringify({choices:[{delta:{content:reply.slice(i,i+2)}}]}) + '\n\n');
    }
    chunks.push('data: [DONE]\n\n');

    var idx = 0;
    var stream = new ReadableStream({
      pull: function(ctrl) {
        return new Promise(function(ok) {
          setTimeout(function() {
            if (idx < chunks.length) { ctrl.enqueue(encoder.encode(chunks[idx++])); ok(); }
            else { ctrl.close(); ok(); }
          }, 30);
        });
      }
    });
    return Promise.resolve(new Response(stream, { status: 200, headers: {'Content-Type':'text/event-stream'} }));
  }
  return _origFetch.apply(this, arguments);
};
</script>

<!-- 这就是唯一加到你网站的东西：一行 script -->
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>联系 — 惊喜之夜</title>
    <meta name="description" content="商务合作、媒体与日常联系。提交后我们将在 24 小时内回复。" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body data-i18n-page="contact">
    <header class="site-header">
      <div class="inner">
        <a href="index.html" class="logo" style="display: flex; align-items: center; gap: 12px; font-size: 1.1rem;">
          <img src="assets/images/logo.png" alt="" style="width: 32px; height: 32px; object-fit: contain;">
          <span>惊喜之夜 <span style="opacity: 0.7; font-size: 0.75rem; font-weight: 400; margin-left: 4px;">/ Surprise Night</span></span>
        </a>
        <button type="button" class="nav-toggle" data-i18n="nav.menu" aria-expanded="false" aria-controls="primary-nav">
          菜单
        </button>
        <nav>
          <ul id="primary-nav" class="nav-links">
            <li><a href="works.html" data-i18n="nav.works">作品</a></li>
            <li><a href="collaborate.html" data-i18n="nav.collaborate">合作</a></li>
            <li class="nav-item nav-item--has-sub">
            <a href="about.html" data-i18n="nav.about">关于</a>
            <ul class="nav-sub" role="list">
              <li><a href="collaborators.html" data-i18n="nav.collaborators">合作艺术家</a></li>
            </ul>
          </li>
            <li><a href="contact.html" aria-current="page" data-i18n="nav.contact">联系</a></li>
            <li class="nav-lang" aria-label="Language">
              <button type="button" class="lang-btn" data-set-lang="zh" aria-pressed="true">中</button>
              <button type="button" class="lang-btn" data-set-lang="en" aria-pressed="false">EN</button>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <div class="page-hero">
        <div class="container">
          <h1 data-i18n="contactPage.h1">联系我们</h1>
          <p class="lead" data-i18n="contactPage.lead">门开着。</p>
        </div>
      </div>

      <section class="section" style="padding-top: 0">
        <div class="container">
          <div
            id="contact-form-status"
            class="contact-form-status"
            role="status"
            aria-live="polite"
            hidden
          ></div>
          <form class="form-wrap" id="contact-form" name="contact" method="post" action="#">
            <div class="form-row">
              <div class="field">
                <label for="name" data-i18n="contactPage.lblName">姓名 *</label>
                <input id="name" name="name" type="text" required autocomplete="name" data-i18n-placeholder="contactPage.phName" placeholder="您的姓名" />
              </div>
              <div class="field">
                <label for="org" data-i18n="contactPage.lblOrg">公司 / 组织 *</label>
                <input id="org" name="organization" type="text" required data-i18n-placeholder="contactPage.phOrg" placeholder="您的公司" />
              </div>
            </div>
            <div class="form-row">
              <div class="field">
                <label for="email" data-i18n="contactPage.lblEmail">邮箱 *</label>
                <input
                  id="email"
                  name="email"
                  type="email"
                  required
                  autocomplete="email"
                  placeholder="email@example.com"
                />
              </div>
              <div class="field">
                <label for="phone" data-i18n="contactPage.lblPhone">电话</label>
                <input id="phone" name="phone" type="tel" autocomplete="tel" data-i18n-placeholder="contactPage.phPhone" placeholder="您的电话" />
              </div>
            </div>
            <div class="field field-full">
              <label for="type" data-i18n="contactPage.lblType">合作类型 *</label>
              <select id="type" name="partnership_type" required>
                <option value="" data-i18n="contactPage.selChoose">请选择</option>
                <option value="p1" data-i18n="contactPage.optP1">现成项目引进</option>
                <option value="p2" data-i18n="contactPage.optP2">驻场演艺合作</option>
                <option value="p3" data-i18n="contactPage.optP3">文旅沉浸式定制</option>
                <option value="p4" data-i18n="contactPage.optP4">戏曲创新开发</option>
                <option value="p5" data-i18n="contactPage.optP5">国际巡演合作</option>
                <option value="p6" data-i18n="contactPage.optP6">品牌联名合作</option>
                <option value="p7" data-i18n="contactPage.optP7">IP 孵化与联合开发</option>
                <option value="other" data-i18n="contactPage.optOther">其他</option>
              </select>
            </div>
            <div class="form-row">
              <div class="field">
                <label for="budget" data-i18n="contactPage.lblBudget">预算范围</label>
                <select id="budget" name="budget_range">
                  <option value="" data-i18n="contactPage.selChoose">请选择</option>
                  <option value="lt50" data-i18n="contactPage.budLt">50 万以下</option>
                  <option value="50-150" data-i18n="contactPage.budMid">50–150 万</option>
                  <option value="150-500" data-i18n="contactPage.budHi">150–500 万</option>
                  <option value="gt500" data-i18n="contactPage.budMax">500 万以上</option>
                  <option value="unknown" data-i18n="contactPage.budUnk">尚未评估</option>
                </select>
              </div>
              <div class="field">
                <label for="timeline" data-i18n="contactPage.lblTime">项目时间线</label>
                <select id="timeline" name="project_timeline">
                  <option value="" data-i18n="contactPage.selChoose">请选择</option>
                  <option value="1m" data-i18n="contactPage.tm1">1 个月内</option>
                  <option value="1-3m" data-i18n="contactPage.tm2">1–3 个月</option>
                  <option value="3-6m" data-i18n="contactPage.tm3">3–6 个月</option>
                  <option value="6m+" data-i18n="contactPage.tm4">6 个月以上</option>
                </select>
              </div>
            </div>
            <div class="field field-full">
              <label for="source" data-i18n="contactPage.lblSource">如何得知我们</label>
              <select id="source" name="referral_source">
                <option value="" data-i18n="contactPage.selChoose">请选择</option>
                <option value="search" data-i18n="contactPage.srcSearch">搜索引擎</option>
                <option value="social" data-i18n="contactPage.srcSocial">社交媒体</option>
                <option value="word" data-i18n="contactPage.srcWord">口碑 / 介绍</option>
                <option value="media" data-i18n="contactPage.srcMedia">媒体报道</option>
                <option value="other" data-i18n="contactPage.srcOth">其他</option>
              </select>
            </div>
            <div class="field field-full">
              <label for="message" data-i18n="contactPage.lblMsg">项目描述</label>
              <textarea id="message" name="message" data-i18n-placeholder="contactPage.phMsg" placeholder="请简要描述您的需求…"></textarea>
            </div>
            <div style="text-align: center">
              <button type="submit" class="btn btn-primary" data-i18n="contactPage.submit">提交咨询</button>
              <p class="form-note" data-i18n="contactPage.formNote" data-i18n-html="true">
                我们力争在 <strong style="color: var(--text)">24 小时内</strong>回复。
              </p>
            </div>
          </form>

          <div class="contact-extra">
            <p><strong style="color: var(--text)" data-i18n="contactPage.biz">商务合作</strong></p>
            <p>
              <a class="email" href="mailto:contact@surprise-night.com">contact@surprise-night.com</a>
            </p>
            <p style="margin-top: 32px"><strong style="color: var(--text)" data-i18n="contactPage.socialH">关注我们的社交媒体</strong></p>
            <div class="social-links">
              <a href="#" data-i18n="contactPage.wx">微信公众号</a>
              <a href="#" data-i18n="contactPage.xhs">小红书</a>
              <a href="#" data-i18n="contactPage.ig">Instagram</a>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="inner">
        <span data-i18n="contactPage.footCopy">© 2026 惊喜之夜</span>
        <a href="index.html" data-i18n="contactPage.footBack">返回首页</a>
      </div>
    </footer>

    <script src="js/i18n.js" defer></script>
    <script src="js/main.js" defer></script>
    <script src="js/contact-form.js" defer></script>
  </body>
</html>
